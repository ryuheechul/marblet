name: Test and Publish

on:
  push:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # CJS entry: Node's require() follows "main" to dist/index.cjs
      - run: node -e "const m = require('.'); if (!m.marblet || !m.expectUpstream) process.exit(1)"
      # ESM entry: Node's import resolves the "import" condition to dist/index.mjs
      - run: node --input-type=module -e "import { marblet, expectUpstream } from 'marblet'; if (!marblet || !expectUpstream) process.exit(1)"

  publish-npm:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: npm publish
