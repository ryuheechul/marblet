name: Create Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: Gate on release commit
        id: gate
        run: |
          # bump PRs merge with "chore: release vX.Y.Z [skip bump]" as the subject
          # (squash) or in the merge commit body (regular merge), same signal bump.yml uses
          COMMIT=$(git log -1 --format="%B")
          if [[ "$COMMIT" == *"chore: release v"* ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - name: Release
        # semantic-release must run on a push event: a pull_request event makes it skip publishing
        # creates the git tag and GitHub release; package.json is already bumped by the bump PR
        # the GitHub release event then triggers publish-npm in npm-publish.yml
        if: steps.gate.outputs.release == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
